services:
  # ── Vector Database ─────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Python Embedding Service ─────────────────────────────────────────────
  embeddings:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    volumes:
      - fastembed_cache:/root/.cache/fastembed
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/ready"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s

  # ── Node.js Fastify API ─────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: server/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_URL: http://embeddings:8081
      NODE_ENV: production
    ports:
      - "8787:8787"
    depends_on:
      qdrant:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

  # ── Offline Ingestion Worker (run once, not a persistent service) ───────
  # Usage: docker compose run --rm ingest
  ingest:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["ingest"]
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: msmarco_xi_passages
      EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      CHUNKING_STRATEGY: semantic_boundary
      LANGUAGES: hi,ta,bn,gu,mr
      BATCH_SIZE: "96"
      CHECKPOINT_DIR: /app/.checkpoints
    volumes:
      - ingest_checkpoints:/app/.checkpoints
      - fastembed_cache:/root/.cache/fastembed
    depends_on:
      qdrant:
        condition: service_healthy
    command: >
      sh -c "
        for STRATEGY in semantic_boundary hierarchical_parent_child metadata_aware adaptive_sliding_window; do
          echo \">>> Starting strategy: $$STRATEGY\";
          CHUNKING_STRATEGY=$$STRATEGY python backend/ingest_msmarco_xi.py;
        done
      "

volumes:
  qdrant_data:
  fastembed_cache:
  ingest_checkpoints:
